services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
      ELEXON_ACTUALS_PATH: /datasets/FUELHH/stream
      ELEXON_FORECASTS_PATH: /datasets/WINDFOR/stream
      DECISION_CUTOFF_HOURS_BEFORE_DELIVERY: "12"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend